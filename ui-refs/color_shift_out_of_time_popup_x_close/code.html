<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            pixel: ['"Press Start 2P"', 'monospace'],
            retro: ['"Silkscreen"', 'monospace'],

            pixelBg: '#F4EFE6',

<style data-purpose="pixel-visual-fx">
    * {
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      box-sizing: border-box;
    }

    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #E2DAC2;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* 3D Pixel Bevels */
    .pixel-tile-neutral {
      background-color: #F8F5EB;
      box-shadow: 
        inset 2px 2px 0 0 #FFFFFF,
        inset -2px -2px 0 0 #DDD2BA,
        0 2.5px 0 0 #9E937D;
      border: 1.5px solid #332B25;
    }
    
    .pixel-tile-ruby {
      background-color: #EF4444;
      box-shadow: 
        inset 2px 2px 0 0 #FFA3A8,
        inset -2px -2px 0 0 #B91C1C,
        0 2.5px 0 0 #7F1D1D;
      border: 1.5px solid #2B1810;
    }

    .pixel-tile-emerald {
      background-color: #22C55E;
      box-shadow: 
        inset 2px 2px 0 0 #86EFAC,
        inset -2px -2px 0 0 #15803D,
        0 2.5px 0 0 #14532D;
      border: 1.5px solid #14281A;
    }

    .pixel-tile-cobalt {
      background-color: #3B82F6;
      box-shadow: 
        inset 2px 2px 0 0 #93C5FD,
        inset -2px -2px 0 0 #1D4ED8,
        0 2.5px 0 0 #1E3A8A;
      border: 1.5px solid #132238;
    }

    .pixel-tile-yellow {
      background-color: #F59E0B;
      box-shadow: 
        inset 2px 2px 0 0 #FDE68A,
        inset -2px -2px 0 0 #B45309,
        0 2.5px 0 0 #451A03;
      border: 1.5px solid #78350F;
    }

    .pixel-tile-purple {
      background-color: #A855F7;
      box-shadow: 
        inset 2px 2px 0 0 #D8B4FE,
        inset -2px -2px 0 0 #7E22CE,
        0 2.5px 0 0 #3B0764;
      border: 1.5px solid #581C87;
    }

    .pixel-tile-cyan {
      background-color: #06B6D4;
      box-shadow: 
        inset 2px 2px 0 0 #A5F3FC,
        inset -2px -2px 0 0 #0891B2,
        0 2.5px 0 0 #155E75;
      border: 1.5px solid #164E63;
    }

    /* Target slots (pixel dashed outline frames with background) */
    .slot-ruby {
      border: 2px dashed #DC2626;
      background-color: rgba(239, 68, 68, 0.12);
    }
    .slot-emerald {
      border: 2px dashed #16A34A;
      background-color: rgba(34, 197, 94, 0.12);
    }
    .slot-cobalt {
      border: 2px dashed #2563EB;
      background-color: rgba(59, 130, 246, 0.12);
    }
    .slot-yellow {
      border: 2px dashed #D97706;
      background-color: rgba(245, 158, 11, 0.12);
    }
    .slot-purple {
      border: 2px dashed #9333EA;
      background-color: rgba(168, 85, 247, 0.12);
    }
    .slot-cyan {
      border: 2px dashed #0891B2;
      background-color: rgba(6, 182, 212, 0.12);
    }

    /* Star flicker / 8-bit pulse */
    @keyframes pixelBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.08); }
    }
    .pixel-star-active {
      animation: pixelBlink 1.6s steps(2, start) infinite;
    }
  </style>
</head>

<!-- Playful micro-interaction script for visual tactile feedback -->
<script data-purpose="casual-interaction">
  document.addEventListener('DOMContentLoaded', () => {
    const tiles = document.querySelectorAll('[data-purpose="grid-matrix"] > div');
    tiles.forEach(tile => {
      tile.addEventListener('click', () => {
        tile.classList.add('translate-y-0.5');
        setTimeout(() => tile.classList.remove('translate-y-0.5'), 100);
      });
    });
  });
</script>
