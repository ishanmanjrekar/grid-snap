<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "background": "#FAF6EE", "retro-bg": "#FAF6EE", "retro-dark": "#221E1D", "retro-border": "#221E1D", "retro-yellow": "#FBBF24", "retro-yellow-dark": "#D97706", "retro-green": "#22C55E", "retro-green-dark": "#15803D", "retro-tile": "#FFFDF7", "retro-tile-shadow": "#E6DEC8", "on-background": "#221E1D", "primary-container": "#FBBF24" }, fontFamily: { "mono": ["Space Mono", "monospace"], "body-md": ["Space Mono", "monospace"], "headline-md": ["Space Mono", "monospace"], "headline-lg": ["Space Mono", "monospace"], "headline-xl": ["Space Mono", "monospace"], "label-lg": ["Space Mono", "monospace"], "label-md": ["Space Mono", "monospace"], "label-sm": ["Space Mono", "monospace"] } } } };</script><style>
