<style data-purpose="pixel-visual-fx">
    /* Universal pixel sharpness */
    * {
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #E2DAC2;
    }

    /* 3D Pixel Bevels */
    .pixel-box-sm {
      box-shadow: 
        inset 2px 2px 0 0 #FFFFFF,
        inset -2px -2px 0 0 #C4BA9D,
        2px 2px 0 0 #2C2523;
    }

    .pixel-tile-neutral {
      background-color: #F8F5EB;
      box-shadow: 
        inset 2.5px 2.5px 0 0 #FFFFFF,
        inset -2.5px -2.5px 0 0 #DDD2BA,
        0 3px 0 0 #9E937D;
      border: 2px solid #332B25;
    }
    
    .pixel-tile-ruby {
      background-color: #EF4444;
      box-shadow: 
        inset 2.5px 2.5px 0 0 #FFA3A8,
        inset -2.5px -2.5px 0 0 #B91C1C,
        0 3px 0 0 #7F1D1D;
      border: 2px solid #2B1810;
    }

    .pixel-tile-emerald {
      background-color: #22C55E;
      box-shadow: 
        inset 2.5px 2.5px 0 0 #86EFAC,
        inset -2.5px -2.5px 0 0 #15803D,
        0 3px 0 0 #14532D;
      border: 2px solid #14281A;
    }

    .pixel-tile-cobalt {
      background-color: #3B82F6;
      box-shadow: 
        inset 2.5px 2.5px 0 0 #93C5FD,
        inset -2.5px -2.5px 0 0 #1D4ED8,
        0 3px 0 0 #1E3A8A;
      border: 2px solid #132238;
    }

    /* Target slots (pixel outline frames) */
    .slot-emerald {
      border: 3px dashed #16A34A;
      background-color: rgba(34, 197, 94, 0.12);
    }
    .slot-ruby {
      border: 3px dashed #DC2626;
      background-color: rgba(239, 68, 68, 0.12);
    }
    .slot-cobalt {
      border: 3px dashed #2563EB;
      background-color: rgba(59, 130, 246, 0.12);
    }

    /* Chunky Arcade Button Frames */
    .arcade-card {
      box-shadow: 
        inset 3px 3px 0 0 #FFFBF0,
        inset -3px -3px 0 0 #A89D80,
        3px 4px 0 0 #2C2523;
    }
    .arcade-card:active {
      transform: translate(2px, 2px);
      box-shadow: 
        inset 3px 3px 0 0 #FFFBF0,
        inset -3px -3px 0 0 #A89D80,
        1px 2px 0 0 #2C2523;
    }

    /* Star flicker / 8-bit pulse */
    @keyframes pixelBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.08); }
    }
    .pixel-star-active {
      animation: pixelBlink 1.6s steps(2, start) infinite;
    }
  </style>
</head>

<!-- Playful micro-interaction script for visual tactile feedback -->
<script data-purpose="casual-interaction">
    document.addEventListener('DOMContentLoaded', () => {
      const tiles = document.querySelectorAll('[data-purpose="grid-matrix"] > div');
      tiles.forEach(tile => {
        tile.addEventListener('click', () => {
          tile.classList.add('translate-y-1');
          setTimeout(() => tile.classList.remove('translate-y-1'), 100);
        });
      });
    });
  </script>
