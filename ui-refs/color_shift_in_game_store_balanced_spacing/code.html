<!-- INTERACTIVE CLIENT LOGIC -->
<script>
    let coins = 99999;
    let lives = 4;

    function playChime() {
      showToast("+ READY TO PLAY!");
    }

    function buyCoins(packName, amount) {
      coins += amount;
      document.getElementById('player-coins').textContent = coins.toLocaleString();
      showToast("ADDED " + packName + "!");
    }

    function buyItem(name, cost) {
      if (name.includes('Heart')) {
        lives += parseInt(name);
        document.getElementById('player-lives').textContent = lives;
      }
      showToast("PURCHASED " + name + "!");
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toast-text');
      text.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 1600);
    }
